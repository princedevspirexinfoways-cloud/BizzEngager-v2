# API — v2.api.bizzengager.com
# Proxies to the API container on 127.0.0.1:4000, with WebSocket upgrade for
# Socket.IO. Run `certbot --nginx -d v2.api.bizzengager.com` to add TLS.
server {
    listen 80;
    listen [::]:80;
    server_name v2.api.bizzengager.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Uploaded editor assets can be large; allow generous bodies for image uploads.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;

        # WebSocket upgrade (Socket.IO).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeouts so idle sockets and long campaign requests aren't cut.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
        proxy_buffering     off;
    }
}
