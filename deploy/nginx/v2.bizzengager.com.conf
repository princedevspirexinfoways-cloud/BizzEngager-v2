# Frontend — v2.bizzengager.com
# Proxies to the frontend container (static SPA) on 127.0.0.1:8080.
# Run `certbot --nginx -d v2.bizzengager.com` to add the TLS listener + redirect.
server {
    listen 80;
    listen [::]:80;
    server_name v2.bizzengager.com;

    # Let certbot answer the ACME challenge from the webroot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
