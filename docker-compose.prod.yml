# Production stack for the VPS: MySQL + Redis + API + worker + frontend.
# Reverse proxy / TLS is handled by the host Nginx (see deploy/nginx/*.conf).
# App ports are published only on 127.0.0.1 so nothing is exposed publicly
# except through the host Nginx.
#
# Usage:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
services:
  mysql:
    image: mysql:8.0
    container_name: bizzengager-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command: --default-authentication-plugin=caching_sha2_password --max_connections=500
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [bizz]

  redis:
    image: redis:7-alpine
    container_name: bizzengager-redis
    restart: unless-stopped
    command: >
      redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy noeviction
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [bizz]

  api:
    build:
      context: ./backend
    container_name: bizzengager-api
    restart: unless-stopped
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads_data:/app/uploads
    networks: [bizz]

  worker:
    build:
      context: ./backend
    container_name: bizzengager-worker
    restart: unless-stopped
    command: ["node", "src/queues/worker.js"]
    env_file: .env.prod
    environment:
      NODE_ENV: production
      DB_HOST: mysql
      REDIS_HOST: redis
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
    networks: [bizz]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-https://v2.api.bizzengager.com}
    container_name: bizzengager-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    networks: [bizz]

volumes:
  mysql_data:
  redis_data:
  uploads_data:

networks:
  bizz:
    driver: bridge
